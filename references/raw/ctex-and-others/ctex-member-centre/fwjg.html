<script type="text/javascript">
	$(document).ready(function(){
		var fwjgTypes = GetQueryString('fwjgType');
		if(fwjgTypes=='1'){
			$("#fwjgtype").val("trade");
		}else if(fwjgTypes=='2'){
			$("#fwjgtype").val("profession");
		}
		
		
		getData(); 
	});
	function doValue(obj){ 
		if(obj.value=='trade'){
			$("#fwjgtype").val("trade");
		}else if(obj.value=='profession'){
			$("#fwjgtype").val("profession");
		}else if(obj.value==''){
			$("#fwjgtype").val("");
		} 
		getData(obj.value); 
	}
	//页面取参
	function GetQueryString(name) {
		let reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)')
		let r = window.location.search.substr(1).match(reg) // search,查询？后面的参数，并匹配正则
		if (r != null) {
			return unescape(r[2])
		}
		return null
	}
	
	function getData(obj){ 
		
		var pageSize=15;
		$.ajax({
			type: "POST",//方法类型
			dataType: "json",//预期服务器返回的数据类型
			async:false,
			data:{"memname":$("#fwjgname").val(),"mtype":obj},
			url: "https://member.ctex.cn/admin/mem/memSearchfwjg?auditstatus=1",//url,
			success: function (result) {
			console.log(result);
				var total = result.total;
				if(total != 0 || total >0){
					$("#pages").jqPaginator({
					totalCounts:result.total,
					totalPages:result.total/15,
					currentPage: 1,
					pageSize:15,
					visiblePages:4,
					onPageChange: function (pNo) {
							var pageNo=pNo;
							var texts_html = "";
							$.each(result.rows,function(index,value){
							
								if((pageNo-1)*pageSize-1<index&&index<pageNo*pageSize){
									if(result.rows[index].memlogo == null){
										
										var list="<li><a href='/sys/detail.shtml?id="+result.rows[index].id+"'><i class='memlogo'>"+result.rows[index].memname+"</i><p>"+result.rows[index].memname+"</p><span>"+result.rows[index].memname+"</span></a></li>" 
									}else{
										
										var list="<li><a href='/sys/detail.shtml?id="+result.rows[index].id+"'><i><img src='"+result.rows[index].memlogo+"'/></i><p>"+result.rows[index].memname+"</p><span>"+result.rows[index].memname+"</span></a></li>" 
									}
									

									texts_html += list;	
								}
							});
							$("#li_container").html(texts_html);
							}
					});
				}	
				$(".pageNum").text("共"+Math.ceil(result.total/15)+"页")
			},
			error : function() {
				console.log("异常！");
			}
		});
	}
	
	
	function searchSubmit(){
		getData();
	}
</script>
