	<script type="text/javascript">
		var container, scene, camera, renderer;
		var pointTexture;
		var aPoints = [], currentAnimatePoints;
		var positionAnimate, rotationAnimate;
		var positionAnimate, rotationAnimate;
		var currentAnimateIndex = -1;
		var isOK = false;
		var tweenParam = {
			"firefly": 0.0020000000000000018,
			"fireflySLOW": 0.002,
			"fireflyFAST": 0.04
		};


		var swiper = new Swiper('.swiper-container', {
			pagination: '.swiper-pagination',
			direction: 'vertical',
			slidesPerView: 1,
			speed: 3500,
			paginationClickable: true,
			spaceBetween: 0.0000001,
			//effect : 'fade',
			//fade: {
			//crossFade: true,
			//},
			mousewheelControl: false
		});

		var currentIndex = 0;
		//统一处理滚轮滚动事件
		var throldHold = 500; //规定时间
		var flag = true; //规定时间内是否可以触发
		var timer = null;
		Window.onload = function () {
			// 编写代码 

		}
		window.addEventListener("beforeunload", function (e) {
			$(".oc-container").css("padding-top", "0");
			$("body").css("position", "static");
		});
		window.addEventListener("load", function (e) {
			$(".oc-container").css("padding-top", "0");
			$("body").css("position", "static");
		});
		$(document).on("mousewheel DOMMouseScroll", onMouseWheel);
		$(document).ready(function () {

		});

		function onMouseWheel(e) {
			var delta = (e.originalEvent.wheelDelta && (e.originalEvent.wheelDelta > 0 ? 1 : -1)) || // chrome & ie
				(e.originalEvent.detail && (e.originalEvent.detail > 0 ? -1 : 1)); // firefox

			if (flag && delta) {
				flag = false; //将开关设置为false，false期间内不能触发事件
				handle(delta); //首次可以触发
				timer = setTimeout(function () {
					clearInterval(timer);
					flag = true; //规定时间到大后，将开关设置为true
				}, throldHold);
			}
		}
		function handle(delta) {
			//向上
			if (delta > 0) {
				$("body").css("position", "static");
				if (currentIndex > 0) {

					if (currentIndex === 2) {
						$(".topContainer").css("display", "block");
						//$(".topContainer").css("transform","translateY(100vh)");

					}
					if (currentIndex === 5) {
						setTimeout(function () {
							swiper.slideTo(2, 5000, false);
						}, 2500);
						activeIndex(2);
						currentAnimateIndex = 2;
						$("#dot1").removeClass("active");
						$("#dot2").removeClass("active");
						$("#dot4").removeClass("active");
						$("#dot3").addClass("active");
					}
					if (currentIndex === 4) {
						setTimeout(function () {
							swiper.slideTo(1, 5000, false);
						}, 2500);
						activeIndex(1);
						currentAnimateIndex = 1;
						$("#dot1").removeClass("active");
						$("#dot3").removeClass("active");
						$("#dot4").removeClass("active");
						$("#dot2").addClass("active");
					}
					if (currentIndex === 3) {
						setTimeout(function () {
							swiper.slideTo(0, 5000, false);
						}, 2500);
						activeIndex(0);
						currentAnimateIndex = 0;
						$("#dot2").removeClass("active");
						$("#dot3").removeClass("active");
						$("#dot4").removeClass("active");
						$("#dot1").addClass("active");
					}
					if (currentIndex === 2) {
						currentIndex = currentIndex - 2;

					} else {
						currentIndex = currentIndex - 1;
					}
					console.log(currentIndex);
				}
			}
			else {//向下
				$(".oc-container").css("padding-top", "0");
				if (currentIndex < 5) {

					if (currentIndex === 1 && isOK) {
						$(".topContainer").css("display", "none");
						//$(".topContainer").css("transform","translateY(-100vh)");
					}
					if (currentIndex === 2) {
						setTimeout(function () {
							swiper.slideTo(1, 5000, false);
						}, 2500);
						activeIndex(1);
						currentAnimateIndex = 1;
						$("#dot1").removeClass("active");
						$("#dot3").removeClass("active");
						$("#dot4").removeClass("active");
						$("#dot2").addClass("active");
					}
					if (currentIndex === 3) {
						setTimeout(function () {
							swiper.slideTo(2, 5000, false);
						}, 2500);
						activeIndex(2);
						currentAnimateIndex = 2;
						$("#dot1").removeClass("active");
						$("#dot2").removeClass("active");
						$("#dot4").removeClass("active");
						$("#dot3").addClass("active");
					}
					if (currentIndex === 4) {
						setTimeout(function () {
							swiper.slideTo(3, 5000, false);
						}, 2500);
						activeIndex(3);
						currentAnimateIndex = 3;
						$("#dot1").removeClass("active");
						$("#dot2").removeClass("active");
						$("#dot3").removeClass("active");
						$("#dot4").addClass("active");
					}
					if (currentIndex === 1 && !isOK) {
						currentIndex = 1;
					} else {
						currentIndex = currentIndex + 1;
					}
				}
				console.log(currentIndex);
			}
		}



		init();
		animate();

		function init() {
			threejsInit();
			window.addEventListener('resize', onWindowResize);
			//document.addEventListener('keydown', onKeyDown, false);
		}
		function threejsInit() {
			//场景1
			container = document.getElementById("webglContainer");
			scene = new THREE.Scene();
			scene.fog = new THREE.FogExp2(0x000000, 0.0005);
			scene.background = new THREE.Color(0x0c0c18);
			camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 5000);
			camera.position.z = 1000;

			renderer = new THREE.WebGLRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setClearColor(new THREE.Color(0x000, 1.0));
			renderer.shadowMap.enabled = true;
			container.appendChild(renderer.domElement);

			pointTexture = new THREE.TextureLoader().load('assets/gradient.png');

			initBackgroudPoints();
			loadAnimatePoints();
		}
		function render() {
			backgroudPointsRender();
			if (currentAnimatePoints) {
				if (!currentAnimatePoints.stopRotation)
					currentAnimatePoints.geometry.rotateY(Math.PI / 600);
				currentAnimatePoints.geometry.verticesNeedUpdate = true;
				currentAnimatePoints.geometry.normalsNeedUpdate = true;
				currentAnimatePoints.geometry.colorsNeedUpdate = true;
				currentAnimatePoints.geometry.uvsNeedUpdate = true;

			}
			renderer.render(scene, camera);
		}

		function animate() {
			requestAnimationFrame(animate);

			TWEEN.update();
			render();
		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

			render();
		}

		function randomPosition(min, max) {
			return Math.random() * (max - min) + min;
		}

		//设置背景的光点
		function initBackgroudPoints() {
			var geometry = new THREE.Geometry,
				pointCount = 800,
				max = 1000;
			geometry.colors = [];
			for (var i = 0; pointCount > i; i++) {
				geometry.vertices.push(
					new THREE.Vector3(
						randomPosition(-max, max),
						randomPosition(-max, max),
						randomPosition(-max, max)
					)
				);
				var colorsIndex = parseInt(Math.random() * 3);
				geometry.colors.push(
					new THREE.Color(0xffffff)
				);
			}

			var material = new THREE.PointsMaterial({
				size: 5,
				map: pointTexture,
				blending: THREE.AdditiveBlending,
				depthWrite: false,
				transparent: true,
				vertexColors: THREE.VertexColors
			});
			xBgPoints = new THREE.Points(geometry, material),
				xBgPoints.position.z = -0.5 * max,
				xBgPoints.position.x = -.3 * max,
				yBgPoints = new THREE.Points(geometry, material),
				yBgPoints.position.z = -.6 * max
			yBgPoints.position.x = -0.2 * max,
				yBgPoints.position.y = 0,
				zBgPoints = new THREE.Points(geometry, material)
			zBgPoints.position.z = -.7 * max,
				scene.add(xBgPoints);
			scene.add(yBgPoints);
			scene.add(zBgPoints);
		}
		//产生背景光点闪烁
		function backgroudPointsRender() {
			if (xBgPoints) {
				yBgPoints.rotation.y += -tweenParam.firefly;
				zBgPoints.rotation.z += tweenParam.firefly / 2;
			}
		}

		//从json中读取场景光点坐标
		function loadAnimatePoints() {
			var index = 0;
			var urls = [
				"assets/logo23.json",
				"assets/earth35.json",
				"assets/map13.json",
				"assets/xingzuo23.json"
			];

			var material = new THREE.PointsMaterial({
				size: 3,
				map: pointTexture,
				blending: THREE.AdditiveBlending
			});
			urls.forEach(function (url, urlIndex) {
				new THREE.JSONLoader().load(url, function (obj) {

					var object = new THREE.Mesh(obj, material);
					if (urlIndex == 0) {
						obj.rotateY(-Math.PI / 12);
					};
					//if(urlIndex == 1){
					//obj.rotateY(-Math.PI);
					//};
					if (urlIndex == 2) {
						obj.rotateY(-Math.PI / 12);
					};
					aPoints[urlIndex] = obj;
					index++;
					if (index === urls.length) {
						setTimeout(function () {
							renderAnimatePoints();
						}, 1000);
					}
				});

			})
		}

		//场景运动光点
		function renderAnimatePoints() {
			var geometry = new THREE.Geometry;
			var max = 800;
			geometry.colors = [];
			for (var n = 0; 29200 > n; n++) {
				geometry.vertices.push(new THREE.Vector3(randomPosition(-1 * max, max), randomPosition(-1 * max, max),
					randomPosition(-12 * max, 1 * max)));
				geometry.colors.push(new THREE.Color(0xFFFFFF));
			}
			var aMaterial = new THREE.PointsMaterial({
				size: 3,
				map: pointTexture,
				blending: THREE.AdditiveBlending,
				transparent: true,
				vertexColors: THREE.VertexColors
			});
			currentAnimatePoints = new THREE.Points(geometry, aMaterial);
			currentAnimatePoints.position.z = 0;
			showFirstAnimatePoints();
		}

		//显示第一个场景的光点
		function showFirstAnimatePoints() {
			scene.add(currentAnimatePoints);
			prepareMove(0, 500);
		}

		//进入页面自动进行第一个场景的切换
		function prepareMove(index, timeout) {
			var cameraObj = [{
				//首页1
				rotation: {
					x: 0,
					y: 0,
					z: 0
				},
				position: {
					x: 0,
					y: 0,
					z: 1000
				}
			},
			//首页2
			{
				rotation: {
					x: 0,
					y: 0,
					z: 0
				},
				position: {
					x: 0,
					y: 0,
					z: 1000
				}
			},
			//首页3
			{
				rotation: {
					x: 0,
					y: 0,
					z: 0
				},
				position: {
					x: 0,
					y: 0,
					z: 1000
				}
			},
			//有方1
			{
				rotation: {
					x: 0,
					y: 0,
					z: 0
				},
				position: {
					x: 0,
					y: 0,
					z: 1000
				}
			}

			];
			setTimeout(function () {
				currentAnimatePoints.stopRotation = true;
				camera.currentPosition = cameraObj[index].position;
				rotationAnimate = new TWEEN.Tween(camera.rotation).easing(TWEEN.Easing.Quintic.Out).to(cameraObj[
					index].rotation, index == 2 ? 2000 : 5000).start();
				positionAnimate = new TWEEN.Tween(camera.position).easing(TWEEN.Easing.Quintic.Out).to(cameraObj[
					index].position, index == 2 ? 3000 : 5000).start();
				exchangeToModel(index);
			}, timeout);
		}

		//切换场景对应的3D模型
		function exchangeToModel(index) {
			currentAnimateIndex = index;
			var endObj = aPoints[index];
			var positionObj = [
				//首页3
				{
					scale: 3000,
					x: 260,
					y: -30,
					z: 0
				},
				//首页1
				{
					scale: 80000,
					x: -320,
					y: 5,
					z: 0
				},
				//首页2
				{
					scale: 80,
					x: 220,
					y: 40,
					z: 0
				},
				//有方1
				{
					scale: 330,
					x: -270,
					y: 0,
					z: 0
				}
			];
			if (index === 0) {
				isOK = true;
			}
			currentAnimatePoints.material.tween = new TWEEN.Tween(currentAnimatePoints.material).easing(TWEEN.Easing
				.Exponential.In);
			currentAnimatePoints.geometry.vertices.forEach(function (point, point_index) {
				var endPointIndex = point_index % endObj.vertices.length;
				var endPoint = endObj.vertices[endPointIndex];
				point.tweenvtx = new TWEEN.Tween(point).to({
					x: endPoint.x * positionObj[index].scale + positionObj[index].x,
					y: endPoint.y * positionObj[index].scale + positionObj[index].y,
					z: endPoint.z * positionObj[index].scale + positionObj[index].z
				}, 3000)
					.easing(TWEEN.Easing.Exponential.In)
					.delay(1000 * Math.random())
					.start();
			});

		}

		//切换场景
		function activeIndex(index) {

			index = parseInt(index);

			if (index != currentAnimateIndex) {
				prepareMove(index, 0);
			}
		}
		//键盘事件监听，进行场景切换
		function onKeyDown(e) {
			if (e.keyCode == 38) {
				if (currentAnimateIndex > 0) {
					activeIndex(currentAnimateIndex - 1);
					currentAnimateIndex = currentAnimateIndex - 1;
				}
